<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>میرا — کمیک</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="glow">
        <stop offset="0" stop-color="#fff6a8" stop-opacity="1"/>
        <stop offset="0.35" stop-color="#ffd23f" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
      </linearGradient>
      <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
        <circle cx="3" cy="3" r="1.3" fill="#000" fill-opacity="0.35"/>
      </pattern>
    </defs>
  </svg>

  <header class="hero">
    <div class="hero-inner">
      <div class="burst">کمیک</div>
      <h1>میرا</h1>
      <p class="sub">(بدون سانسور)</p>
      <p class="by">برگرفته از داستانی از کریستوفر فرانک · ترجمه‌ی لیلی گلستان</p>
      <a class="start" href="#story">شروع خواندن ↓</a>
    </div>
    <div class="hero-art" id="heroArt"></div>
  </header>

  <nav class="tabs">
    <button id="tabFull" class="on" type="button">داستان کامل (کمیک)</button>
    <button id="tabSum" type="button">خلاصه‌ی کمیک</button>
  </nav>

  <main id="reader" class="reader"></main>
  <main id="story" class="hidden"></main>

  <section class="outro">
    <h2>باید این دشت را دگرگون ساخت.</h2>
    <p>باید دیوارهای شیشه‌ای را شکست. باید فردیت‌ها را نجات بخشید.</p>
    <p class="credit">این صفحه یک اقتباس مصور و غیررسمی از داستان «میرا»ست.</p>
  </section>

  <script>window.STORY = [];</script>
  <script src="app.js"></script>
  <script src="s1.js"></script>
  <script src="s2.js"></script>
  <script src="s3.js"></script>
  <script src="s4.js"></script>
  <script src="s5.js"></script>
  <script src="reader.js"></script>
</body>
</html>
